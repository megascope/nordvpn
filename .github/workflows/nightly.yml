name: Nightly NordVPN Tag

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check-and-tag:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.latest.outputs.version }}
      should_build: ${{ steps.tag-check.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest NordVPN version
        id: latest
        run: |
          set -euo pipefail
          URL="https://repo.nordvpn.com/deb/nordvpn/debian/dists/stable/main/binary-amd64/Packages"
          pkgtmp=$(mktemp)
          curl -fsSL "$URL" -o "$pkgtmp"
          versions=$(awk 'BEGIN{p=0} /^Package: nordvpn$/ {p=1;next} p && /^Version:/ {print $2; p=0}' "$pkgtmp")
          if [ -z "$versions" ]; then
            echo "No versions found in Packages file" >&2
            exit 1
          fi
          latest=$(echo "$versions" | sort -V | tail -n1)
          echo "Latest version: $latest"
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: tag-check
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; skipping release and build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $tag is new; creating release and triggering build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release for new tag
        if: steps.tag-check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.latest.outputs.version }}
          target_commitish: ${{ github.event.repository.default_branch || 'main' }}
          draft: false
          prerelease: false

  run-build:
    needs: check-and-tag
    if: needs.check-and-tag.outputs.should_build == 'true'
    uses: ./.github/workflows/build-common.yml
    with:
      release_tag: v${{ needs.check-and-tag.outputs.version }}
    secrets: inherit
